<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAHMO-WLM Automated Flasher</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --primary: #2563eb; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #ffffff; color: #1e293b; }
    </style>
</head>
<body class="p-4 md:p-10 min-h-screen flex items-center justify-center bg-slate-50/50">

<div class="max-w-xl w-full space-y-6">
    
    <header class="flex justify-between items-center bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm">
        <div>
            <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">TAHMO-WLM Flasher</h1>
            <p class="text-xs text-slate-500 mt-0.5 font-medium">Direct USB Firmware Deployment Utility</p>
        </div>
        <a href="index.html" class="inline-flex items-center px-4 py-2.5 text-xs font-bold rounded-xl border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 transition-all shadow-sm">
            ← Console
        </a>
    </header>

    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-6">

        <div class="space-y-2 p-4 bg-slate-50 rounded-xl border border-slate-100">
            <div class="flex justify-between items-center text-xs font-bold text-slate-600">
                <span id="progressLabel">Status: Checking assets...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="w-full bg-slate-200 rounded-full h-3 overflow-hidden">
                <div id="progressBar" class="bg-blue-600 h-full w-0 transition-all duration-150 ease-out"></div>
            </div>
        </div>

        <div>
            <button id="flashBtn" class="w-full text-center text-sm bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-xl font-bold transition shadow-xl shadow-blue-100 disabled:opacity-40 disabled:cursor-not-allowed" disabled>
                Select Drive & Deploy Firmware
            </button>
        </div>

    </div>
</div>

<script>
    let activeFileBytes = null;
    const targetFileName = "Wlm-firmware.uf2";

    // DOM Elements
    const flashBtn = document.getElementById('flashBtn');
    const progressBar = document.getElementById('progressBar');
    const progressPercent = document.getElementById('progressPercent');
    const progressLabel = document.getElementById('progressLabel');

    // Runtime Guard Check for APIs
    if (!('showDirectoryPicker' in window)) {
        progressLabel.innerText = "Browser error: Directory Picker not supported.";
    } else {
        // Automatically fetch firmware on load
        loadTargetFirmware();
    }

    async function loadTargetFirmware() {
        try {
            const response = await fetch(`./${targetFileName}`);
            if (!response.ok) {
                throw new Error(`Asset fetch missing or returned status code ${response.status}`);
            }

            const buffer = await response.arrayBuffer();
            activeFileBytes = new Uint8Array(buffer);

            progressLabel.innerText = "Ready to deploy.";
            flashBtn.disabled = false;
        } catch (err) {
            progressLabel.innerText = `Error: Missing "${targetFileName}" in this folder.`;
        }
    }

    flashBtn.addEventListener('click', async () => {
        if (!activeFileBytes) return;

        try {
            // 1. Invoke directory picker to identify target flash drive volume mount
            const dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });

            // Lock UI controls to protect the running thread
            flashBtn.disabled = true;
            progressBar.style.width = '0%';
            progressPercent.innerText = '0%';
            progressLabel.innerText = "Initializing flash write...";

            // 2. Provision empty destination workspace block
            const fileHandle = await dirHandle.getFileHandle(targetFileName, { create: true });
            const writableStream = await fileHandle.createWritable();

            const chunkSize = 65536; // Fast 64KB execution blocks
            let offset = 0;

            // 3. Write data chunks to the virtual flash filesystem
            while (offset < activeFileBytes.length) {
                const chunk = activeFileBytes.slice(offset, offset + chunkSize);
                await writableStream.write(chunk);
                offset += chunk.length;

                const currentPct = Math.round((offset / activeFileBytes.length) * 100);
                progressBar.style.width = `${currentPct}%`;
                progressPercent.innerText = `${currentPct}%`;
                progressLabel.innerText = `Writing: ${currentPct}%`;
            }

            // 4. Close handles to securely force write operations out of memory cache
            await writableStream.close();

            progressLabel.innerText = "Success! Device should unmount and deploy instantly.";

        } catch (err) {
            if (err.name === 'AbortError') {
                progressLabel.innerText = "Flash setup canceled.";
            } else {
                progressLabel.innerText = `Write Error: ${err.message}`;
            }
        } finally {
            flashBtn.disabled = false;
        }
    });
</script>

</body>
</html>
