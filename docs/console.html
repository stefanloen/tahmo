<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAHMO-WLM Mission Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --primary: #2563eb; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #ffffff; color: #1e293b; }
        .terminal-container { height: 500px; }
        .val-mono { font-family: 'ui-monospace', 'SFMono-Regular', Menlo, Monaco, Consolas, monospace; }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="p-4 md:p-10">

<div class="max-w-6xl mx-auto space-y-8">
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
        <div>
            <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">TAHMO-WLM Console</h1>
        </div>
        <div class="flex items-center gap-3">
            <a href="index.html" class="inline-flex items-center px-6 py-3 text-sm font-bold rounded-xl border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 transition-all shadow-sm">
                ← Telemetry Decoder
            </a>
            <button id="connectBtn" class="bg-blue-600 text-white px-8 py-3 rounded-xl font-bold cursor-pointer hover:bg-blue-700 transition shadow-xl shadow-blue-100 flex items-center gap-2">
                <span id="connectStatusDot" class="w-2.5 h-2.5 bg-blue-300 rounded-full animate-pulse"></span>
                <span id="connectBtnText">Connect WLM Device</span>
            </button>
        </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <div class="space-y-6">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                <div>
                    <h3 class="text-xs font-black uppercase tracking-widest text-slate-400">Query Commands</h3>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="sendMacro('status')" class="macro-element p-2.5 text-xs font-bold border border-slate-200 rounded-xl text-slate-700 hover:bg-slate-50 text-left transition disabled:opacity-40" disabled>
                        📋 status
                    </button>
                    <button onclick="sendMacro('batvolt')" class="macro-element p-2.5 text-xs font-bold border border-slate-200 rounded-xl text-slate-700 hover:bg-slate-50 text-left transition disabled:opacity-40" disabled>
                        🔋 batvolt
                    </button>
                    <button onclick="sendMacro('gettemp')" class="macro-element p-2.5 text-xs font-bold border border-slate-200 rounded-xl text-slate-700 hover:bg-slate-50 text-left transition disabled:opacity-40" disabled>
                        🌡️ gettemp
                    </button>
                    <button onclick="sendMacro('getconst')" class="macro-element p-2.5 text-xs font-bold border border-slate-200 rounded-xl text-slate-700 hover:bg-slate-50 text-left transition disabled:opacity-40" disabled>
                        🛰️ getconst
                    </button>
                    <button onclick="sendMacro('getconfig')" class="macro-element p-2.5 text-xs font-bold border border-slate-200 rounded-xl text-slate-700 hover:bg-slate-50 text-left transition disabled:opacity-40" disabled>
                        ⚙️ getconfig
                    </button>
                    <button onclick="sendMacro('help')" class="macro-element p-2.5 text-xs font-bold border border-slate-200 rounded-xl text-slate-700 hover:bg-slate-50 text-left transition disabled:opacity-40" disabled>
                        ❓ help
                    </button>
                </div>
            </div>

            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                <h3 class="text-xs font-black uppercase tracking-widest text-slate-400">Configuration Macros</h3>
                
                <div class="space-y-1.5 p-3 bg-slate-50/60 rounded-xl border border-slate-100">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block">Set Elevation Range (0-90°)</label>
                    <div class="flex gap-2 items-center">
                        <input type="number" id="cfgElevationMin" placeholder="Min" value="5" class="macro-element w-full bg-white border border-slate-200 rounded-lg p-1.5 text-xs font-semibold text-slate-700 focus:outline-none" disabled>
                        <input type="number" id="cfgElevationMax" placeholder="Max" value="30" class="macro-element w-full bg-white border border-slate-200 rounded-lg p-1.5 text-xs font-semibold text-slate-700 focus:outline-none" disabled>
                        <button onclick="applyConfigElevation()" class="macro-element bg-slate-800 text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-slate-900 disabled:opacity-40" disabled>Set</button>
                    </div>
                </div>

                <div class="space-y-1.5 p-3 bg-slate-50/60 rounded-xl border border-slate-100">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block">Set Azimuth Range (0-360°)</label>
                    <div class="flex gap-2 items-center">
                        <input type="number" id="cfgAzimuthMin" placeholder="Min" value="120" class="macro-element w-full bg-white border border-slate-200 rounded-lg p-1.5 text-xs font-semibold text-slate-700 focus:outline-none" disabled>
                        <input type="number" id="cfgAzimuthMax" placeholder="Max" value="240" class="macro-element w-full bg-white border border-slate-200 rounded-lg p-1.5 text-xs font-semibold text-slate-700 focus:outline-none" disabled>
                        <button onclick="applyConfigAzimuth()" class="macro-element bg-slate-800 text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-slate-900 disabled:opacity-40" disabled>Set</button>
                    </div>
                </div>

                <div class="space-y-1.5 p-3 bg-slate-50/60 rounded-xl border border-slate-100">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block">Set Height Range (0.0-50.0m)</label>
                    <div class="flex gap-2 items-center">
                        <input type="number" step="0.1" id="cfgHeightMin" placeholder="Min" value="0.5" class="macro-element w-full bg-white border border-slate-200 rounded-lg p-1.5 text-xs font-semibold text-slate-700 focus:outline-none" disabled>
                        <input type="number" step="0.1" id="cfgHeightMax" placeholder="Max" value="15.0" class="macro-element w-full bg-white border border-slate-200 rounded-lg p-1.5 text-xs font-semibold text-slate-700 focus:outline-none" disabled>
                        <button onclick="applyConfigHeight()" class="macro-element bg-slate-800 text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-slate-900 disabled:opacity-40" disabled>Set</button>
                    </div>
                </div>

                <div class="space-y-1.5 p-3 bg-slate-50/60 rounded-xl border border-slate-100">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block">Set Measurements (Time / N / Min)</label>
                    <div class="grid grid-cols-3 gap-1 mb-2">
                        <input type="text" id="cfgMeasTime" placeholder="00:00:00" value="00:00:00" class="macro-element w-full bg-white border border-slate-200 rounded-lg p-1.5 text-center text-xs font-semibold text-slate-700 focus:outline-none" disabled>
                        <input type="number" id="cfgMeasCount" placeholder="Count" value="4" class="macro-element w-full bg-white border border-slate-200 rounded-lg p-1.5 text-center text-xs font-semibold text-slate-700 focus:outline-none" disabled>
                        <input type="number" id="cfgMeasDur" placeholder="Min" value="60" class="macro-element w-full bg-white border border-slate-200 rounded-lg p-1.5 text-center text-xs font-semibold text-slate-700 focus:outline-none" disabled>
                    </div>
                    <button onclick="applyConfigMeasurements()" class="macro-element w-full bg-slate-800 text-white py-1.5 rounded-lg text-xs font-bold hover:bg-slate-900 disabled:opacity-40" disabled>Set Measurements Config</button>
                </div>
            </div>
        </div>

        <div class="lg:col-span-2 space-y-6 flex flex-col justify-between">
            
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="text-xs font-black uppercase tracking-widest text-slate-400">Command Input Pipeline</h3>
                    <span id="statusBadge" class="text-[10px] font-black text-red-500 uppercase tracking-wide">Disconnected</span>
                </div>
                <div class="relative">
                    <input type="text" id="txInput" placeholder="Type raw firmware command here..." disabled
                           class="w-full bg-slate-50 border border-slate-200 rounded-xl p-4 text-sm font-semibold text-slate-700 focus:outline-none focus:border-blue-500 disabled:opacity-50 disabled:cursor-not-allowed transition-colors pr-32">
                    <button id="sendBtn" disabled class="absolute right-2 top-2 bg-slate-800 text-white px-5 py-2 rounded-lg text-xs font-bold hover:bg-slate-900 transition disabled:opacity-40 disabled:cursor-not-allowed">
                        Execute
                    </button>
                </div>
                <div class="flex justify-end items-center pt-2 mt-2">
                    <button id="clearBtn" class="text-xs text-slate-400 hover:text-slate-600 font-medium transition">Clear Stream View</button>
                </div>
            </div>

            <main class="flex-grow">
                <div class="bg-slate-950 p-6 rounded-3xl shadow-xl border border-slate-900 relative overflow-hidden h-full flex flex-col">
                    <div class="flex justify-between items-center pb-4 mb-2 border-b border-slate-800 text-xs">
                        <div class="flex items-center gap-2">
                            <span class="w-3 h-3 bg-slate-800 rounded-full inline-block"></span>
                            <span class="w-3 h-3 bg-slate-800 rounded-full inline-block"></span>
                            <span class="w-3 h-3 bg-slate-800 rounded-full inline-block"></span>
                        </div>
                    </div>

                    <div id="terminalLog" class="terminal-container overflow-y-auto val-mono text-sm p-2 text-slate-300 space-y-1 custom-scrollbar selection:bg-slate-800 flex-grow"></div>
                </div>
            </main>

        </div>
    </div>
</div>

<script>
    let port = null;
    let reader = null;
    let keepReading = false;
    let readLoopPromise = null;
    
    // Core buffer variable ensuring partial frames are safely reassembled
    let streamLineAccumulator = ""; 

    // DOM bindings
    const connectBtn = document.getElementById('connectBtn');
    const connectBtnText = document.getElementById('connectBtnText');
    const connectStatusDot = document.getElementById('connectStatusDot');
    const txInput = document.getElementById('txInput');
    const sendBtn = document.getElementById('sendBtn');
    const terminalLog = document.getElementById('terminalLog');
    const statusBadge = document.getElementById('statusBadge');
    const clearBtn = document.getElementById('clearBtn');
    const macroElements = document.querySelectorAll('.macro-element');

    // Web Serial Framework Check
    if (!('serial' in navigator)) {
        alert("Web Serial API is unsupported on this browser version. Use Chrome, Edge, or Opera.");
        connectBtn.disabled = true;
    }

    connectBtn.addEventListener('click', async () => {
        if (port) {
            await disconnectDevice();
        } else {
            await connectDevice();
        }
    });

    async function connectDevice() {
        try {
            if (!port) {
                port = await navigator.serial.requestPort();
            }
            
            try {
                await port.open({ baudRate: 115200 }); 
                appendLog('SYS', 'Target hardware communication active.');
            } catch (openError) {
                if (openError.message.includes("already open")) {
                    appendLog('SYS', 'Port channel was already mapped open under-the-hood. Stream re-attaching...');
                } else {
                    throw openError;
                }
            }
            
            setSystemState(true);
            keepReading = true;
            readLoopPromise = readSerialStream(); 

            // Automatically emit the help command trigger token on a safe thread block delay
            setTimeout(() => {
                transmitPayload('?');
            }, 150);

        } catch (error) {
            appendLog('ERR', `Bus attachment failure handling aborted: ${error.message}`);
            port = null;
        }
    }

    async function disconnectDevice() {
        keepReading = false;
        
        if (reader) {
            try {
                await reader.cancel();
            } catch (e) {}
        }
        
        if (readLoopPromise) {
            await readLoopPromise;
            readLoopPromise = null;
        }
        
        if (port) {
            try {
                await port.close();
            } catch (e) {
                console.warn("Port close rejected or already completed: ", e.message);
            }
        }
        
        setSystemState(false);
        appendLog('SYS', 'Target hardware disconnected.');
        port = null;
    }

    // Stream line processing reassembler engine
    async function readSerialStream() {
        const textDecoder = new TextDecoder();
        
        while (port && port.readable && keepReading) {
            try {
                reader = port.readable.getReader();
                
                while (keepReading) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    
                    if (value) {
                        // Concat incoming binary buffers smoothly via the stream decoder flag
                        streamLineAccumulator += textDecoder.decode(value, { stream: true });
                        
                        // Parse looking for structural newline marks
                        let completedLines = streamLineAccumulator.split("\n");
                        
                        // Pop off incomplete split fragment string to process on subsequent chunks
                        streamLineAccumulator = completedLines.pop();
                        
                        // Safely emit completely printed string vectors
                        for (const line of completedLines) {
                            let cleanStr = line.trim();
                            if (cleanStr.length > 0) {
                                appendLog('RX', cleanStr);
                            }
                        }
                    }
                }
            } catch (error) {
                if (keepReading) {
                    appendLog('ERR', `Operational fault caught in hardware poll loop: ${error.message}`);
                }
                break;
            } finally {
                if (reader) {
                    reader.releaseLock();
                    reader = null;
                }
            }
        }
    }

    async function transmitPayload(payloadString) {
        if (!port || !port.writable) return;
        if (!payloadString.trim()) return;

        const framedCommand = payloadString.trim() + "\n"; 
        
        try {
            const encoder = new TextEncoder();
            const rawBytes = encoder.encode(framedCommand);
            
            const writer = port.writable.getWriter();
            await writer.write(rawBytes);
            writer.releaseLock();

            appendLog('TX', payloadString.trim());
        } catch (error) {
            appendLog('ERR', `Transmission system fault encountered: ${error.message}`);
        }
    }

    // Command Macros Triggers
    function sendMacro(cmdName) {
        transmitPayload(cmdName);
    }

    function applyConfigElevation() {
        const min = document.getElementById('cfgElevationMin').value;
        const max = document.getElementById('cfgElevationMax').value;
        transmitPayload(`setconfig elevation ${min} ${max}`);
    }

    function applyConfigAzimuth() {
        const min = document.getElementById('cfgAzimuthMin').value;
        const max = document.getElementById('cfgAzimuthMax').value;
        transmitPayload(`setconfig azimuth ${min} ${max}`);
    }

    function applyConfigHeight() {
        const min = document.getElementById('cfgHeightMin').value;
        const max = document.getElementById('cfgHeightMax').value;
        transmitPayload(`setconfig height ${min} ${max}`);
    }

    function applyConfigMeasurements() {
        const time = document.getElementById('cfgMeasTime').value;
        const count = document.getElementById('cfgMeasCount').value;
        const duration = document.getElementById('cfgMeasDur').value;
        transmitPayload(`setconfig measurements ${time} ${count} ${duration}`);
    }

    // User Transmit Interaction Handlers
    sendBtn.addEventListener('click', () => {
        transmitPayload(txInput.value);
        txInput.value = '';
    });

    txInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            transmitPayload(txInput.value);
            txInput.value = '';
        }
    });

    clearBtn.addEventListener('click', () => {
        terminalLog.innerHTML = `<div class="text-slate-600 text-xs italic">[Record view buffer wiped]</div>`;
    });

    // Logging Core Append Layout Function
    function appendLog(type, content) {
        const time = new Date().toISOString().split('T')[1].slice(0, -1);
        const escapedContent = content.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        let uiRow = '';

        if (type === 'RX') {
            uiRow = `<div><span class="text-slate-600 text-xs">[${time}]</span> <span class="text-emerald-400 font-bold">&lt;&lt;</span> <span class="text-slate-200 font-medium">${escapedContent}</span></div>`;
        } else if (type === 'TX') {
            uiRow = `<div><span class="text-slate-600 text-xs">[${time}]</span> <span class="text-blue-400 font-bold">&gt;&gt;</span> <span class="text-blue-300 font-semibold">${escapedContent}</span></div>`;
        } else if (type === 'ERR') {
            uiRow = `<div class="bg-red-950/40 border-l-2 border-red-500 p-1 text-red-400 font-semibold">[CRITICAL EXCEPTION]: ${escapedContent}</div>`;
        } else {
            uiRow = `<div class="text-slate-500 italic">[SYS]: ${escapedContent}</div>`;
        }

        terminalLog.insertAdjacentHTML('beforeend', uiRow);
        terminalLog.scrollTop = terminalLog.scrollHeight;
    }

    // Sync Interface Visual Element States
    function setSystemState(connected) {
        if (connected) {
            connectBtn.classList.remove('bg-blue-600', 'hover:bg-blue-700', 'shadow-blue-100');
            connectBtn.classList.add('bg-rose-600', 'hover:bg-rose-700', 'shadow-rose-100');
            connectBtnText.innerText = "Disconnect Target";
            connectStatusDot.classList.remove('bg-blue-300');
            connectStatusDot.classList.add('bg-rose-300');

            txInput.disabled = false;
            sendBtn.disabled = false;
            statusBadge.innerText = "Connected Active";
            statusBadge.className = "text-[10px] font-black text-emerald-500 uppercase tracking-wide";
            macroElements.forEach(element => element.disabled = false);
        } else {
            connectBtn.classList.remove('bg-rose-600', 'hover:bg-rose-700', 'shadow-rose-100');
            connectBtn.classList.add('bg-blue-600', 'hover:bg-blue-700', 'shadow-blue-100');
            connectBtnText.innerText = "Connect WLM Device";
            connectStatusDot.classList.remove('bg-rose-300');
            connectStatusDot.classList.add('bg-blue-300');

            txInput.disabled = true;
            sendBtn.disabled = true;
            statusBadge.innerText = "Disconnected";
            statusBadge.className = "text-[10px] font-black text-red-500 uppercase tracking-wide";
            macroElements.forEach(element => element.disabled = true);
        }
    }
</script>

</body>
</html>
