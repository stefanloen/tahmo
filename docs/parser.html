<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hex Packet Decoder</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --card: #ffffff; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: #1e293b; padding: 2rem; }
        .container { max-width: 800px; margin: 0 auto; }
        textarea { width: 100%; height: 80px; padding: 10px; border: 2px solid #cbd5e1; border-radius: 8px; font-family: monospace; font-size: 1.1rem; resize: vertical; }
        button { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; margin-top: 10px; }
        button:hover { background: #1d4ed8; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-top: 20px; }
        .card { background: var(--card); padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .measurement-card { border-left: 4px solid var(--primary); margin-bottom: 10px; }
        h2 { border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; margin-top: 0; }
        label { font-weight: bold; display: block; margin-bottom: 5px; color: #64748b; font-size: 0.8rem; text-transform: uppercase; }
        .val { font-size: 1.2rem; font-family: monospace; color: #0f172a; }
        .error { color: #dc2626; background: #fee2e2; padding: 10px; border-radius: 6px; display: none; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Hex Packet Decoder</h1>
    <p>Paste your hex string below (e.g., 5756E9D4C0...)</p>
    
    <textarea id="hexInput" placeholder="Enter hex string..."></textarea>
    <button onclick="decode()">Decode Packet</button>
    <div id="errorLog" class="error"></div>

    <div id="results" style="display:none;">
        <div class="card" style="margin-top:20px;">
            <h2>Header Data</h2>
            <div class="grid">
                <div><label>Battery</label><div class="val" id="h-batt">-</div></div>
                <div><label>Temperature</label><div class="val" id="h-temp">-</div></div>
                <div><label>Latitude</label><div class="val" id="h-lat">-</div></div>
                <div><label>Longitude</label><div class="val" id="h-lon">-</div></div>
            </div>
            <div id="charge-states" style="margin-top:1.5rem; display: flex; gap: 10px; flex-wrap: wrap;"></div>
        </div>

        <h2 style="margin-top:2rem;">Measurements</h2>
        <div id="measurementsList"></div>
    </div>
</div>

<script>
// Constants from your Python script
const MAX_STD_DEV = 1.0;
const MAX_REL_HEIGHT = 20.0;
const MIN_TEMP_C = -30.0, MAX_TEMP_C = 80.0;
const MIN_BATT_MV = 2000, MAX_BATT_MV = 5000;

function mapRange(val, inMax, outMin, outMax) {
    if (val <= 0) return outMin;
    if (val >= inMax) return outMax;
    return outMin + (val / inMax) * (outMax - outMin);
}

function decode() {
    const rawHex = document.getElementById('hexInput').value.replace(/\s+/g, '');
    const errorLog = document.getElementById('errorLog');
    const results = document.getElementById('results');
    
    try {
        if (rawHex.length % 2 !== 0) throw "Invalid Hex string length";
        const bytes = new Uint8Array(rawHex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
        errorLog.style.display = 'none';
        results.style.display = 'block';

        // 1. Parse Header (5 bytes: batt, temp, lat, lon, charge)
        const battery = Math.round(mapRange(bytes[0], 255, MIN_BATT_MV, MAX_BATT_MV));
        const temp = mapRange(bytes[1], 255, MIN_TEMP_C, MAX_TEMP_C).toFixed(2);
        const lat = bytes[2];
        const lon = bytes[3];
        const chargeByte = bytes[4];

        document.getElementById('h-batt').innerText = `${battery} mV`;
        document.getElementById('h-temp').innerText = `${temp} °C`;
        document.getElementById('h-lat').innerText = lat;
        document.getElementById('h-lon').innerText = lon;

        // 2. Charge State Fraction (Bit shifting)
        const names = ["Completed", "Charging", "Recoverable", "Nonrecoverable"];
        const vals = [
            (chargeByte >> 6) & 0b11,
            (chargeByte >> 4) & 0b11,
            (chargeByte >> 2) & 0b11,
            (chargeByte >> 0) & 0b11
        ];
        const total = vals.reduce((a, b) => a + b, 0);
        
        const chargeHtml = vals.map((v, i) => {
            const pct = total ? (v / total * 100).toFixed(1) : 0;
            return `<div style="background:#f1f5f9; padding:8px 12px; border-radius:20px; font-size:0.9rem;">
                <strong>${names[i]}:</strong> ${v} (${pct}%)
            </div>`;
        }).join('');
        document.getElementById('charge-states').innerHTML = chargeHtml;

        // 3. Parse Measurements (6 bytes each: uid, u16LE, u8, u8, u8)
        const list = document.getElementById('measurementsList');
        list.innerHTML = '';
        
        for (let i = 5; i + 6 <= bytes.length; i += 6) {
            const uid = bytes[i];
            // Little Endian u16
            const rawRelMean = bytes[i+1] | (bytes[i+2] << 8);
            const rawRelStd = bytes[i+3];
            const numUsed = bytes[i+4];
            const numSeen = bytes[i+5];

            const relMean = mapRange(rawRelMean, 65535, 0, MAX_REL_HEIGHT).toFixed(3);
            const relStd = mapRange(rawRelStd, 255, 0, MAX_STD_DEV).toFixed(3);

            list.innerHTML += `
                <div class="card measurement-card">
                    <div class="grid">
                        <div><label>UID</label><div class="val">${uid}</div></div>
                        <div><label>Rel Height Mean</label><div class="val">${relMean} m</div></div>
                        <div><label>Rel Height Std</label><div class="val">${relStd}</div></div>
                        <div><label>Obs (Used/Seen)</label><div class="val">${numUsed} / ${numSeen}</div></div>
                    </div>
                </div>`;
        }
    } catch (e) {
        errorLog.innerText = "Error: " + e;
        errorLog.style.display = 'block';
        results.style.display = 'none';
    }
}
</script>

</body>
</html>
